[mypy]
python_version = 3.14
ignore_missing_imports = true
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
# A list of bare names for vulture, never imported; every entry is undefined
# by design (ruff.toml ignores F821 there for the same reason). Without this,
# the first entry anyone adds fails the mypy hook.
exclude = ^vulture_whitelist\.py$
