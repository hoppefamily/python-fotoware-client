name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    # The org variable LINUX_RUNNER names the self-hosted Mac mini; see the
    # self-hosted-runner README for moving jobs back while it is down.
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'
    - name: Install
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install -e .
    - name: Tests
      run: python -m pytest
