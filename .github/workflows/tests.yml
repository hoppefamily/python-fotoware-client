name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    # GitHub-hosted, not the org's self-hosted runner: this repo is meant to
    # go public, and a fork's pull request must never run on our machine.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'
    - name: Install
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install -e .
    - name: Tests
      run: python -m pytest
